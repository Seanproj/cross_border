# 건강보험 및 기타 보험 (형식: docs/DATA_SPEC.md §2)

- template_key: de.insurance.health_mandatory
  version: 1
  category: insurance
  title: "독일 건강보험 가입"
  description: "독일에 거주지가 있는 모든 사람은 건강보험에 가입할 의무가 있습니다. 공적 건강보험(GKV)과 민간 건강보험(PKV) 중 어디에 가입하는지는 개인 상황에 따라 다릅니다."
  region_scope: federal
  applicability: { all: [] }
  prerequisites: []
  required_documents: []
  deadline_rule: null
  estimated_duration: null
  sources:
    - source_key: bmg.gkv
      supports: [existence]
      excerpt: "Deshalb besteht für alle Bürgerinnen und Bürger mit Wohnsitz in Deutschland die Verpflichtung zum Abschluss einer Krankenversicherung."
    - source_key: bmg.gkv
      supports: [procedure]
      excerpt: "Wer keinen anderweitigen Anspruch auf Absicherung im Krankheitsfall hat, ist daher versicherungspflichtig in der GKV, wenn er zuletzt gesetzlich krankenversichert war oder dem gesetzlichen System zuzuordnen ist."
  verification_status: needs_review
  last_verified_at: null
  review_notes: "GKV/PKV 중 어느 쪽인지 판정하지 말 것(MVP 범위 밖). 체류허가 신청 시 보험 증명 요구 여부는 별도 출처 필요."

- template_key: de.insurance.kr_de_social_security_agreement
  version: 1
  category: insurance
  title: "한·독 사회보장협정(연금) 적용 여부 확인"
  description: "한국과 독일 사이의 사회보장협정은 2003년 3월 1일 발효되었고 연금보험 분야를 다룹니다. 두 나라에서 낸 연금 가입 기간을 연금 수급 자격 판단에 합산할 수 있게 해 줍니다. 독일에서 일하는 경우 가입 의무는 건강보험 조합(Krankenkasse)이 연금 기관을 대신해 확인합니다."
  region_scope: federal
  applicability:
    review_required: true
    all:
      - { field: move_purpose, op: in, value: [employment, self_employed] }
  prerequisites: []
  required_documents: []
  deadline_rule: null
  estimated_duration: null
  sources:
    - source_key: drv.korea
      supports: [existence]
      excerpt: "Das Sozialversicherungsabkommen mit Korea ist am 1. März 2003 in Kraft getreten und regelt die Beziehungen zwischen Korea und der Bundesrepublik Deutschland auf dem Gebiet der Rentenversicherung."
    - source_key: drv.korea
      supports: [procedure]
      excerpt: "Arbeiten Sie in Deutschland, prüft die Einzugsstelle für die Sozialversicherungsbeiträge (Krankenkasse) stellvertretend für den deutschen Rentenversicherungsträger, ob Sie versicherungspflichtig sind."
  verification_status: needs_review
  last_verified_at: null
  review_notes: "'합산' 설명은 출처 문장 일부('Es führt vor allem dazu, dass Ihre deutschen und koreanischen Versicherungszeiten für einen Rente…')가 잘려 있어 전체 문장 확인 필요."

- template_key: de.insurance.posting_certificate
  version: 1
  category: insurance
  title: "파견 근무자: 파견 증명서(Entsendebescheinigung) 확인"
  description: "회사가 기간을 정해 다른 나라로 파견하는 경우 처음 24개월 동안은 원래 나라의 연금보험이 유지됩니다. 이때 파견 증명서가 필요합니다. 이 페이지는 독일에서 한국으로 파견되는 경우를 설명하므로, 한국에서 독일로 파견되는 경우에도 같은지 확인이 필요합니다."
  region_scope: federal
  applicability:
    review_required: true
    all:
      - { field: move_purpose, op: eq, value: employment }
  prerequisites: []
  required_documents: []
  deadline_rule: null
  estimated_duration: null
  sources:
    - source_key: drv.korea
      supports: [existence, procedure]
      excerpt: "Werden Sie von ihrem Arbeitgeber für eine im Voraus zeitlich begrenzte Arbeit nach Korea entsandt, bleiben Sie während der ersten 24 Monate weiterhin in Deutschland versichert."
    - source_key: drv.korea
      supports: [documents]
      excerpt: "Denken Sie an die Entsendebescheinigung"
  verification_status: needs_review
  last_verified_at: null
  review_notes: "출처는 독일→한국 파견 기준. 한국→독일 파견은 한국 국민연금공단 출처 필요. 프로필에 '파견 여부' 필드가 없어 항상 확인 필요로 제시."

