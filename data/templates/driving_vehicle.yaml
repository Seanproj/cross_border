      supports: [existence, deadline]
      excerpt: "Inhaber einer gültigen ausländischen Fahrerlaubnis dürfen nach Wohnsitznahme im Bundesgebiet im Umfang ihrer Berechtigung solange der ausländische Führerschein gültig ist aber längstens für weitere 6 Monate, im Inland Kraftfahrzeuge führen."
