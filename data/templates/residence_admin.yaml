# 체류/행정 절차 (형식: docs/DATA_SPEC.md §2)

- template_key: de.residence.entry_visa_free_kr
  version: 1
  category: residence_admin
  title: "입국 방식 확인: 한국 국적자는 비자 없이 입국 후 독일에서 체류허가 신청 가능"
  description: "한국(Republik Korea)은 독일에 비자 없이 입국한 뒤 독일 안에서 체류 허가를 신청할 수 있는 국가 목록에 포함되어 있습니다. 같은 목록에서 취업 목적 체류허가가 제외된다는 각주는 한국에는 붙어 있지 않습니다. 개인 상황에 따른 판단은 관할 외국인청에 확인해야 합니다."
  region_scope: federal
  applicability: { all: [] }
  prerequisites: []
  required_documents: []
  deadline_rule: null
  estimated_duration: null
  sources:
    - source_key: berlin.lea.laengerer_aufenthalt
      supports: [existence, procedure]
      excerpt: "Für bestimmte Staaten gelten besondere Vergünstigungen. Sie können auch ohne Visum jeden Aufenthaltstitel im Bundesgebiet beantragen."
    - source_key: berlin.lea.laengerer_aufenthalt
      supports: [existence]
      excerpt: "Republik Korea (Südkorea)"
    - source_key: berlin.lea.laengerer_aufenthalt
      supports: [procedure]
      excerpt: "1 Ausgenommen sind Aufenthaltstitel zur Erwerbstätigkeit. Angehörige dieser Staaten müssen dann mit einem nationalen Visum einreisen."
  verification_status: needs_review
  last_verified_at: null
  review_notes: "각주 1은 Andorra, Brasilien 등에만 표시되고 Korea에는 없음(자동 수집 텍스트 기준). 원문 화면에서 각주 표시를 사람이 확인할 것. 법적 근거(AufenthV §41)와 신청 기한은 법령 사이트 접속 불가로 미확인. 평가 케이스 rag.conflict.korea_visa_free 와 연결."

- template_key: de.residence.permit.berlin
  version: 1
  category: residence_admin
  title: "베를린 외국인청(LEA)에 취업 체류허가 온라인 신청"
  description: "베를린 외국인청(Landesamt für Einwanderung)은 취업 목적 체류허가를 온라인 신청으로만 받습니다. 외국인청이 연방고용청(Bundesagentur für Arbeit)과 내부 동의 절차를 진행하며, 시간이 걸릴 수 있습니다."
  region_scope: city:berlin
  applicability:
    all:
      - { field: move_purpose, op: eq, value: employment }
  prerequisites:
    - { template_key: de.registration.address.berlin, kind: soft }
    - { template_key: de.residence.employment_declaration.berlin, kind: hard }
  required_documents:
    - { name: "고용주가 작성한 '고용 관계 확인서(Erklärung zum Beschäftigungsverhältnis)'", source_key: berlin.lea.beschaeftigung }
    - { name: "근로계약서 또는 구체적인 채용 확약서", source_key: berlin.lea.beschaeftigung }
  deadline_rule: null
  estimated_duration: null
  sources:
    - source_key: berlin.lea.beschaeftigung
      supports: [existence, procedure]
      excerpt: "Bitte nutzen Sie für Aufenthaltstitel zur Beschäftigung nur noch unsere Online-Anträge"
    - source_key: berlin.lea.beschaeftigung
      supports: [procedure]
      excerpt: "Die Ausländerbehörde klärt die Möglichkeit einer Beschäftigung in einem internen Zustimmungsverfahren mit den Operativen Services der Bundesagentur für Arbeit"
    - source_key: berlin.lea.beschaeftigung
      supports: [documents]
      excerpt: "und eine aussagekräftige Einstellungszusage oder besser einen Arbeitsvertrag."
    - source_key: berlin.lea.beschaeftigung
      supports: [procedure]
      excerpt: "Bitte berücksichtigen Sie, dass für die Beteiligung der Bundesagentur für Arbeit eine gewisse Zeitdauer erforderlich ist."
  verification_status: needs_review
  last_verified_at: null
  review_notes: "주소 등록이 신청의 선행 조건인지(hard) 출처로 확인되지 않아 soft로 둠. 건강보험 증명 등 추가 서류는 직종별 하위 페이지 확인 필요."

